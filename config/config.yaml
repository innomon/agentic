# Agentic Framework - Default Configuration
#
# This is a minimal configuration to get started.
# See examples/ for domain-specific configurations:
#   ./agentic examples/med-fhir/config.yaml console    # Medical FHIR transcription
#   ./agentic examples/farmer/config.yaml console       # Organic farming advisor
#   ./agentic examples/routing/config.yaml console       # Role-based routing
#   ./agentic examples/search/config.yaml console        # Web search agent
#   ./agentic examples/wasm-sequential/config.yaml console  # WASM orchestrator

root_agent: RootAgent

models:
  gemini-flash:
    provider: gemini
    model_id: gemini-2.0-flash
    default: true

  # Uncomment for OpenAI:
  # gpt4o:
  #   provider: openai
  #   model_id: gpt-4o

  # Uncomment for local Ollama:
  # local-llama:
  #   provider: ollama
  #   model_id: llama3.2
  #   base_url: http://localhost:11434/v1

agents:
  RootAgent:
    description: General-purpose assistant that routes to specialized sub-agents
    model: gemini-flash
    sub_agents:
      - HelperAgent
    instruction: |
      You are a helpful assistant powered by the Agentic framework.
      You can answer questions and help with various tasks.

      When the user needs detailed analysis or research, transfer to HelperAgent.

  HelperAgent:
    description: Detailed analysis and research assistant
    model: gemini-flash
    instruction: |
      You are a research and analysis assistant. Provide detailed,
      well-structured answers to complex questions. Use markdown
      formatting for clarity.
