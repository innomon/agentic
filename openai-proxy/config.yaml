# OpenAI Proxy Configuration
# Proxies OpenAI-compatible API requests to ADK endpoints

proxy:
  # Listen address for the proxy server
  listen: ":9080"

  # ADK backend configuration
  adk:
    # Base URL of the ADK server OR "local" to run agents in-process
    endpoint: http://localhost:8080
    # ADK app name to route requests to (ignored if endpoint is "local")
    app_name: Agentic
    # Path to agentic config.yaml (required if endpoint is "local")
    # config_path: "../examples/farmer/config.yaml"

  # Default values for requests
  defaults:
    # Default user ID when not specified in request
    user_id: openai-proxy-user
